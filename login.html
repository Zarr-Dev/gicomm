<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta name="description" content="Sign in to Gicomm - Access your digital library, saved products, and dashboard."/>
  <meta name="theme-color" content="#f5f5f2"/>
  <title>
   Gicomm &mdash; Sign in
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body class="auth">
  <div class="auth-shell">
   <a class="brand" href="index.html">
    <span class="brand-mark">
     G
    </span>
    Gicomm
   </a>
   <div class="auth-card">
    <p class="eyebrow">
     WELCOME BACK
    </p>
    <h1>
     Sign in to Gicomm.
    </h1>
    <p class="muted">
     Access your library, saved products, and dashboard.
    </p>
    <p id="authMessage" class="muted" role="status" aria-live="polite" hidden=""></p>
    <form id="loginForm">
     <label id="displayNameField" hidden="">
      Display name
      <input id="displayName" autocomplete="name" maxlength="80" placeholder="Your name" type="text"/>
     </label>
     <label id="emailField">
      Email
      <input id="email" autocomplete="email" placeholder="you@example.com" required="" type="email"/>
     </label>
     <label id="passwordField">
      <span id="passwordLabel">Password</span>
      <input id="password" autocomplete="current-password" placeholder="••••••••" required="" type="password"/>
     </label>
     <label id="confirmPasswordField" hidden="">
      Confirm password
      <input id="confirmPassword" autocomplete="new-password" placeholder="••••••••" type="password"/>
     </label>
     <div class="auth-row">
      <span>
       Remember me
      </span>
      <a href="#" id="forgot">
       Forgot password?
      </a>
     </div>
     <button class="primary wide">
      Continue
     </button>
    </form>
    <div class="or">
     or
    </div>
    <p class="auth-note">
     Google and GitHub sign-in will be enabled after their providers are configured.
    </p>
    <p class="auth-bottom">
     Need an account?
     <a href="#" id="signup">
      Create account
     </a>
    </p>
   </div>
   <p class="auth-note">
    Secure account access powered by Supabase Auth.
   </p>
  </div>
  <script src="js/pages/auth.js" type="module">
  </script>
 </body>
</html>
